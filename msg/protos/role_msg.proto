syntax = "proto3";
package role_msg;

option csharp_namespace = "Net.Proto.Role";
option go_package = "wx_game/msg";

//角色基础信息
message RoleBase {
    int64 role_id = 1;
    string name = 2;        // 角色名字
    int32 avatar_id = 3;		// 角色头像id
    int32 frame_id = 4; 		//头像框id
    string avatar_url = 5;		//自定义头像
    int32 step = 6; //引导步骤
}

//修改角色名称
message RoleAlterName {

    message Request{
        string name = 1;
    }
	
    message Response{
        int32 code = 1;
    }
}

//修改角色头像
message RoleAlterFace {

    message Request{
        int32 avatar_id = 1;		// 角色头像id
        int32 frame_id = 2; 		//头像框id
        string avatar_url = 3;		//自定义头像
    }
	
    message Response{
        int32 code = 1;
    }
}

//修改引导步骤
message RoleAlterStep {

    message Request{
        int32 step = 1;
    }

    message Response{
        int32 code = 1;
        int32 step = 2;
    }
}